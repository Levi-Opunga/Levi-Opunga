name: Profile images

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#BB0000&color_dots=#E5E7EB,#A7D7BE,#4FAE80,#0E7A4B,#004D2C&color_dot_border=#F3F4F6
            dist/snake-dark.svg?color_snake=#E03A3A&color_dots=#23262C,#0B4D33,#0E8A55,#3DBF85,#8FE3BC&color_dot_border=#16181C
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Draw stats and languages cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node .github/scripts/cards.mjs .
      - name: Commit if changed
        run: |
          git add metrics.*.svg
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update profile cards"
          git push
