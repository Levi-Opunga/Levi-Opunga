name: Profile images

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FFD23F&color_dots=#2A2163,#4B2A7A,#7A2D8C,#C2337F,#FF3E8A&color_dot_border=#110C30
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Draw stats and languages cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node .github/scripts/cards.mjs .
      - name: Commit if changed
        run: |
          git add metrics.stats.svg metrics.languages.svg
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update profile cards"
          git push
