<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img">
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
  .fade { opacity: 0; animation: fade .5s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .bar { transform-origin: left; animation: grow .8s ease-out forwards; }
</style>
<rect x=".5" y=".5" rx="10" width="399" height="199" fill="#1a1b27" stroke="#2a2e42"/>
<text x="25" y="38" fill="#70a5fd" font-size="18" font-weight="700">Most used languages</text>
<clipPath id="bar"><rect x="25" y="55" width="350" height="10" rx="5"/></clipPath>
<g clip-path="url(#bar)"><g class="bar"><rect x="25.0" y="55" width="259.5" height="10" fill="#3178c6"/><rect x="284.5" y="55" width="46.5" height="10" fill="#A97BFF"/><rect x="330.9" y="55" width="15.7" height="10" fill="#f1e05a"/><rect x="346.6" y="55" width="11.1" height="10" fill="#b07219"/><rect x="357.7" y="55" width="6.7" height="10" fill="#336790"/><rect x="364.3" y="55" width="4.7" height="10" fill="#ff5a03"/><rect x="369.1" y="55" width="4.1" height="10" fill="#ff3e00"/><rect x="373.2" y="55" width="2.0" height="10" fill="#89e051"/></g></g>
